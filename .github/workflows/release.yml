name: Publish release

# Manual entry point. The library is built pinned to the two Strata runtimes
# (CUDA and HIP) and the three go to the GitHub release v<version>. The
# runtimes are the latest ones of the release `strata-runtime`, which
# runtime.yml builds (50+ minutes); with "build_runtime" this run builds them
# first, the same way.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without the v (e.g. 0.2.0)'
        type: string
        required: true
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true
      build_runtime:
        description: 'Build the Strata runtimes first (else: the latest of the strata-runtime release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  runtime:
    name: Strata runtimes
    if: ${{ inputs.build_runtime }}
    uses: ./.github/workflows/runtime.yml

  package:
    name: Package ${{ inputs.version }}
    needs: runtime
    # the runtimes were built by this run, or are taken from strata-runtime
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The plugin screens are bundled and embedded in the library.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/download-artifact@v4
        if: ${{ inputs.build_runtime }}
        with:
          pattern: runtime-*
          path: runtimes
          merge-multiple: true

      - name: Take the latest runtimes
        if: ${{ !inputs.build_runtime }}
        shell: bash
        run: |
          gh release download strata-runtime --repo "${{ github.repository }}" --dir runtimes \
            --pattern 'strata-runtime-linux-x86_64.tar.gz' --pattern 'strata-runtime-hip-linux-x86_64.tar.gz' \
            || { echo 'no runtimes in the strata-runtime release: run "Build Strata runtime" first, or this one with build_runtime' >&2; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Runtimes in this release
        shell: bash
        run: |
          for archive in runtimes/*.tar.gz; do
            echo "$(basename "$archive"): $(tar -xzOf "$archive" runtime/RUNTIME.json | tr -d '\n ')"
          done

      - name: Build and package
        id: package
        shell: bash
        run: |
          ./scripts/package.sh --platform linux-x86_64 --version "${{ inputs.version }}" \
            --repository "${{ github.repository }}" | tee package.txt
          mkdir -p release
          cp "$(sed -n 's/^artifact=//p' package.txt)" \
             "$(sed -n 's/^public_manifest=//p' package.txt)" \
             runtimes/strata-runtime-linux-x86_64.tar.gz \
             runtimes/strata-runtime-hip-linux-x86_64.tar.gz release/
        env:
          STRATA_RUNTIME_ARCHIVE: runtimes/strata-runtime-linux-x86_64.tar.gz
          STRATA_RUNTIME_HIP_ARCHIVE: runtimes/strata-runtime-hip-linux-x86_64.tar.gz

      - name: Test
        shell: bash
        run: cargo test --locked

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: release/*

  license-server:
    name: License server v${{ inputs.version }}
    needs: package
    # Prereleases never reach the license server.
    # (the runtimes job may be skipped: only the package's result counts)
    if: ${{ !cancelled() && needs.package.result == 'success' && !inputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Downloads the release back, checks the library against the manifest published with it and only then uploads it.
      - name: Publish linux-x86_64 to the license server
        shell: bash
        run: ./scripts/publish-to-license-server.sh --version "v${{ inputs.version }}" --reason "release v${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
          POM_RELEASE_TOKEN: ${{ secrets.POM_RELEASE_TOKEN }}
          POM_RELEASE_API: ${{ secrets.POM_RELEASE_API }}
